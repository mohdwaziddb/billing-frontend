# Har location me include karo. nginx ka niyam: jis location me apna koi bhi
# add_header ho, wahan server-level add_header inherit NAHI hote. Pehle CSP,
# Referrer-Policy, Permissions-Policy isi wajah se kabhi bheje hi nahi jaate the.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# connect-src/img-src https: -> API aur company logo alag origin (VITE_API_BASE_URL) par ho sakte hain.
# checkout.razorpay.com (script + iframe) / api.razorpay.com (iframe) -> Razorpay Checkout popup (Collect Online).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
